<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rede de ônibus de Maricá · Maricá bus network</title>
  <meta name="description" content="Explore the Maricá (RJ) public bus network as a graph: lines, stops, centrality, shortest routes and stop spacing. Em português e inglês.">
  <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e131a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121a24'/%3E%3Cpath d='M14 44 L30 22 L50 30' fill='none' stroke='%233cc7a9' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='14' cy='44' r='5' fill='%23e6ebf0'/%3E%3Ccircle cx='30' cy='22' r='5' fill='%23e6ebf0'/%3E%3Ccircle cx='50' cy='30' r='5' fill='%23e6ebf0'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="data/network.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="app.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a href="#panel" class="skip-link" data-i18n="skip">Pular para o painel</a>

  <div class="app">
    <aside id="panel" class="panel" tabindex="-1">
      <header class="panel-header">
        <div class="title-row">
          <div>
            <h1 data-i18n="title">Rede de ônibus de Maricá</h1>
            <p class="subtitle" data-i18n="subtitle">Ônibus públicos (EPT) de Maricá, RJ, modelados como um grafo</p>
          </div>
          <div class="lang" role="group" aria-label="Idioma" data-i18n-label="language">
            <button type="button" data-lang="pt" aria-pressed="true">PT</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </div>
        </div>
        <nav class="tabs" role="tablist" aria-label="Seções">
          <button type="button" role="tab" data-tab="overview" data-i18n="tabs.overview">Visão geral</button>
          <button type="button" role="tab" data-tab="lines" data-i18n="tabs.lines">Linhas</button>
          <button type="button" role="tab" data-tab="stops" data-i18n="tabs.stops">Paradas</button>
          <button type="button" role="tab" data-tab="route" data-i18n="tabs.route">Rota</button>
          <button type="button" role="tab" data-tab="corridor" data-i18n="tabs.corridor">Corredor</button>
          <span class="tab-indicator" aria-hidden="true"></span>
        </nav>
      </header>

      <div class="panel-body" data-view role="tabpanel" aria-live="polite">
        <p class="loading">…</p>
      </div>

      <footer class="panel-footer">
        <span data-i18n="footer">Dados: Moovit (2025), OpenStreetMap e CARTO.</span>
        <a href="https://github.com/gcfialho/uerj-marica-transit-network">GitHub</a>
      </footer>
    </aside>

    <main class="map-wrap">
      <div id="map" class="map" role="region" aria-label="Mapa interativo da rede de ônibus de Maricá" data-i18n-label="mapLabel"></div>
      <div class="legend" data-legend aria-live="polite"></div>
      <div class="pick-banner" data-pick-banner hidden></div>
    </main>
  </div>

  <noscript>
    <p class="noscript">This explorer needs JavaScript. The data is in <a href="data/network.json">data/network.json</a>
      and the analysis in the <a href="https://github.com/gcfialho/uerj-marica-transit-network">repository</a>.</p>
  </noscript>
</body>
</html>
