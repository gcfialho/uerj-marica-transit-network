[project]
name = "marica-transit"
version = "1.0.0"
description = "Graph model and interactive maps of the Maricá (RJ, Brazil) public bus network."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Fialho" }]
requires-python = ">=3.12"
keywords = ["graph-theory", "networkx", "public-transit", "geospatial", "folium"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "folium>=0.17",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Only needed to re-scrape Moovit or re-geocode stops; the default pipeline is offline.
fetch = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[project.scripts]
marica-transit = "marica_transit.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-networkx>=3.6.1.20261031",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marica_transit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913", # CLI-facing functions legitimately take many options
    "PLR2004", # magic values are fine in tests and thresholds
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# folium's PolyLine (and other plugins) are not annotated; calling them is fine.
untyped_calls_exclude = ["folium"]

[[tool.mypy.overrides]]
# BeautifulSoup is part of the optional `fetch` extra, not installed by default.
module = ["bs4", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
